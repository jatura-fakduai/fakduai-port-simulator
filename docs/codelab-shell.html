<style>
/* Layout: warehouse-floor codelab. White cards on a cool slate floor, like the simulator. Each track is a zone; every step carries a location-style code (P-03, L1-02). Sticky aisle rail on the left, one step at a time on the right. */
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --ink:#0E1A3A; --muted:#5B6785; --rule:#D9E0EC;
  --accent:#2453C8; --accent-ink:#FFFFFF; --accent-soft:#E6EDFB;
  --receive:#2F8F5B; --receive-soft:#E3F3EA; --pick:#B86E0A; --pick-soft:#FFF4E2;
  --code-bg:#F1F4FA; --ring:#FFB000;
  --line:#06C755; --n8n:#E5486B; --oai:#202123; --oai-ink:#FFFFFF;
  --font-display:"Prompt","Sarabun",system-ui,sans-serif;
  --font-body:"Sarabun","Leelawadee UI","Thonburi",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1222; --surface:#121B30; --ink:#E6ECF7; --muted:#93A0BC; --rule:#22304D;
  --accent:#7C9DFF; --accent-ink:#0B1222; --accent-soft:#1A2850;
  --receive:#4CC38A; --receive-soft:#12301F; --pick:#F2B34A; --pick-soft:#2E2410;
  --code-bg:#18233D; --ring:#FFC53D; --oai:#ECECEC; --oai-ink:#111111; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1222; --surface:#121B30; --ink:#E6ECF7; --muted:#93A0BC; --rule:#22304D;
  --accent:#7C9DFF; --accent-ink:#0B1222; --accent-soft:#1A2850;
  --receive:#4CC38A; --receive-soft:#12301F; --pick:#F2B34A; --pick-soft:#2E2410;
  --code-bg:#18233D; --ring:#FFC53D; --oai:#ECECEC; --oai-ink:#111111; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.75;padding-inline:16px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.25}
.brand span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* track switcher */
nav.tracks{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
nav.tracks button{all:unset;cursor:pointer;flex:none;display:flex;flex-direction:column;gap:1px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--rule);min-width:118px}
nav.tracks button:hover{border-color:var(--accent)}
nav.tracks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tracks .t-code{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
nav.tracks .t-name{font-family:var(--font-display);font-weight:600;font-size:14.5px;line-height:1.3}
nav.tracks .t-tag{font-size:11.5px;color:var(--muted)}
nav.tracks button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tracks button[aria-selected="true"] .t-code,nav.tracks button[aria-selected="true"] .t-tag{color:var(--accent-ink);opacity:.85}
nav.tracks button.locked{opacity:.62}

.bar{height:5px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--receive);width:0;transition:width .3s}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
.layout.single{grid-template-columns:minmax(0,1fr)}
.layout.single nav.rail{display:none}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px}
nav.rail .zone{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 8px 8px}
nav.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav.rail button{all:unset;cursor:pointer;display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:7px 8px;border-radius:8px;font-size:14px;line-height:1.4;color:var(--muted)}
nav.rail button:hover{background:var(--bg);color:var(--ink)}
nav.rail button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.rail button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.loc{font-family:var(--font-mono);font-size:11.5px;font-weight:600;text-align:center;padding:2px 0;border-radius:5px;border:1.5px solid var(--rule);background:var(--surface);color:var(--muted)}
button[aria-current="step"] .loc{border-color:var(--accent);color:var(--accent)}
.done .loc{background:var(--receive);border-color:var(--receive);color:#fff}

main{min-width:0}
section.step{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:26px clamp(18px,4vw,40px) 30px}
.step-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:4px}
.code-badge{font-family:var(--font-mono);font-weight:600;font-size:12px;padding:2px 9px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;font-weight:500}
.chip.line{background:var(--line);color:#fff}
.chip.n8n{background:var(--n8n);color:#fff}
.chip.oai{background:var(--oai);color:var(--oai-ink)}
.chip.sheet{background:#1E8E3E;color:#fff}
.chip.time{background:var(--code-bg);color:var(--muted)}
.chip.who{background:var(--pick-soft);color:var(--pick)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance}
h2{font-weight:700;font-size:clamp(22px,3vw,28px);line-height:1.3;margin:6px 0 12px}
h3{font-weight:600;font-size:18px;margin:28px 0 8px}
.step p,.step li{max-width:70ch}
.step ol.do{padding-left:0;list-style:none;counter-reset:do;display:flex;flex-direction:column;gap:18px;margin:18px 0}
.step ol.do>li{counter-increment:do;display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px}
.step ol.do>li::before{content:counter(do);font-family:var(--font-mono);font-size:13px;font-weight:600;width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-top:2px}
.step ol.do>li>div{min-width:0}

code{font-family:var(--font-mono);font-size:.88em;background:var(--code-bg);padding:1px 6px;border-radius:4px}
.copyline{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:10px 0}
.copyline .val{flex:1 1 260px;min-width:0;font-family:var(--font-mono);font-size:13.5px;background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;overflow-x:auto;white-space:nowrap;color:var(--ink)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:500;border:1px solid var(--rule);background:var(--surface);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.copied{border-color:var(--receive);color:var(--receive)}
.btn[disabled]{opacity:.4;pointer-events:none}
a.btn{text-decoration:none}

figure.shot{margin:14px 0 6px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--bg);max-width:780px}
figure.shot a{display:block;line-height:0}
figure.shot img{display:block;width:100%;height:auto}
figure.shot video{display:block;width:100%;height:auto;background:#000}
figure.shot figcaption{padding:6px 12px 8px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--rule);background:var(--surface);line-height:1.5}

.note{border-radius:10px;padding:12px 16px;margin:16px 0;font-size:14.5px;background:var(--accent-soft);max-width:72ch}
.note.warn{background:var(--pick-soft);color:var(--ink)}
.note.warn b{color:var(--pick)}
.note.ok{background:var(--receive-soft)}
.note b{font-weight:600}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.grid>div{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;font-size:14px;background:var(--bg);min-width:0}
.grid strong{display:block;font-family:var(--font-display);font-size:15.5px;margin-bottom:2px}

/* system flow */
.flowmap{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:16px 0}
.node{flex:1 1 130px;min-width:0;background:var(--surface);border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;position:relative}
.node .n-k{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.05em}
.node .n-t{font-family:var(--font-display);font-weight:700;font-size:15.5px;line-height:1.3}
.node .n-d{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.node.hot{border-color:var(--accent);background:var(--accent-soft)}
.arrow{align-self:center;font-family:var(--font-mono);color:var(--muted)}

.chat{display:flex;flex-direction:column;gap:8px;max-width:440px;margin:14px 0;padding:14px;border-radius:14px;background:var(--code-bg);border:1px solid var(--rule)}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14.5px;line-height:1.5}
.bub.me{align-self:flex-end;background:var(--line);color:#fff;border-bottom-right-radius:4px}
.bub.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--rule);border-bottom-left-radius:4px}

.tbl{overflow-x:auto;margin:14px 0}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.t{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
tr.lab td{background:var(--accent-soft)}
.st{font-family:var(--font-mono);font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.st.ready{background:var(--receive-soft);color:var(--receive)}
.st.soon{background:var(--code-bg);color:var(--muted)}

pre.sysmsg,pre.snippet{font-family:var(--font-mono);font-size:12.5px;line-height:1.6;background:var(--code-bg);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:8px 0;max-width:72ch;color:var(--ink)}
pre.sysmsg{max-height:340px;overflow:auto}
.grid pre.snippet{margin:6px 0 8px}
.quiz{border:1px solid var(--rule);border-radius:14px;padding:18px clamp(14px,3vw,24px);background:var(--bg);max-width:760px;margin-top:16px}
.q-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.q-score{font-variant-numeric:tabular-nums;color:var(--receive);font-weight:600}
.q-bar{height:5px;border-radius:3px;background:var(--rule);margin:8px 0 4px;overflow:hidden}
.q-bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.q-text{font-size:clamp(18px,2.6vw,22px);margin:14px 0 14px;line-height:1.45}
.q-choices{display:flex;flex-direction:column;gap:8px}
.q-choice{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;padding:11px 14px;border-radius:10px;border:1.5px solid var(--rule);background:var(--surface);font-size:15.5px;line-height:1.45}
.q-choice:hover{border-color:var(--accent)}
.q-choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q-choice .k{font-family:var(--font-mono);font-weight:600;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--code-bg);color:var(--muted)}
.q-choice.right{border-color:var(--receive);background:var(--receive-soft)}
.q-choice.right .k{background:var(--receive);color:#fff}
.q-choice.wrong{border-color:var(--pick);background:var(--pick-soft)}
.q-choice.wrong .k{background:var(--pick);color:#fff}
.q-choice[disabled]{cursor:default}
.q-explain{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:14.5px}
.q-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.quiz-done{text-align:center;padding:28px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--bg);max-width:760px;margin-top:16px}
.big-score{font-family:var(--font-display);font-weight:700;font-size:56px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}

[hidden]{display:none!important}
/* ===== theme + accent ===== */
:root[data-accent="green"]{--accent:#138A52;--accent-soft:#DFF4E8}
:root[data-accent="orange"]{--accent:#C2410C;--accent-soft:#FDEBDD}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-accent="green"]{--accent:#4CD38D;--accent-soft:#123222}
  :root:not([data-theme="light"])[data-accent="orange"]{--accent:#FB8F5A;--accent-soft:#3A1F12}
}
:root[data-theme="dark"][data-accent="green"]{--accent:#4CD38D;--accent-soft:#123222}
:root[data-theme="dark"][data-accent="orange"]{--accent:#FB8F5A;--accent-soft:#3A1F12}

.brand img{height:38px;width:auto;flex:none}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--code-bg);border:1px solid var(--rule)}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:inline-flex;gap:6px;align-items:center}
.sw{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--rule)}
.sw[data-accent="blue"]{background:#2453C8}.sw[data-accent="green"]{background:#22A863}.sw[data-accent="orange"]{background:#E1641F}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{background:#C62828;border-color:#C62828;color:#fff}
.btn.big{padding:12px 22px;font-size:16px;border-radius:12px}
.metarow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-top:10px;padding:0 4px}

nav.tracks button{position:relative;overflow:hidden}
nav.tracks .t-prog{position:absolute;left:0;bottom:0;height:3px;background:var(--receive);width:0;transition:width .3s}
nav.tracks button[aria-selected="true"] .t-prog{background:var(--accent-ink);opacity:.6}
nav.tracks .t-done{position:absolute;top:8px;right:10px;font-size:12px;color:var(--receive);font-weight:700}
nav.tracks button[aria-selected="true"] .t-done{color:var(--accent-ink)}

.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;margin:4px 0 8px}
.hero .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.hero h2{font-size:clamp(26px,4vw,38px);line-height:1.2;margin:6px 0 10px}
.hero p{color:var(--muted);font-size:16.5px}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px}
.resume-hint{font-size:13.5px;color:var(--muted)}
.hero-art{border-radius:16px;overflow:hidden;border:1px solid var(--rule);line-height:0;box-shadow:0 12px 32px -18px rgba(14,26,58,.45)}
.hero-art img{width:100%;height:auto;display:block}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0 6px}
.zones .zone{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--rule);background:var(--bg);transition:transform .15s,border-color .15s}
.zones .zone:hover{border-color:var(--accent);transform:translateY(-2px)}
.zones .zone:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--receive) calc(var(--p)*1%),var(--rule) 0)}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;font-weight:600}
.zones .zone .z-code{font-family:var(--font-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.zones .zone .z-name{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.3}
.zones .zone .z-tag{font-size:12.5px;color:var(--muted);line-height:1.4}

section.step:not([hidden]){animation:stepIn .28s ease-out}
@keyframes stepIn{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.kbd-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
.kbd-hint kbd{font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;background:var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:15px;font-weight:500;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);z-index:50;max-width:calc(100vw - 32px)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:49;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.modal{position:fixed;inset:0;background:rgba(8,12,24,.55);display:grid;place-items:center;padding:16px;z-index:60}
.modal-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;max-width:420px;width:100%;border:1px solid var(--rule)}
.modal-card h3{margin:0 0 6px}
.modal-card .row{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}

@media (max-width:880px){.hero{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){section.step:not([hidden]){animation:none}.zones .zone{transition:none}.confetti{display:none}}

.sitefoot{max-width:1180px;margin:0 auto;padding-block:0 32px}
.sitefoot-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 20px}
.sitefoot .ws{font-size:13.5px;color:var(--muted)}
.sitefoot .ws b{color:var(--ink);font-family:var(--font-display)}
.credits{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.credit{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);border-radius:8px;padding:4px 2px}
.credit:hover .n,.credit:hover .k{color:var(--accent)}
.credit:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.credit .k{font-size:12px;color:var(--muted);white-space:nowrap}
.credit .n{font-family:var(--font-display);font-weight:700;font-size:15px}
.credit img.fk{height:24px;width:auto;display:block}
.credit img.pinto{height:40px;width:40px;border-radius:9px;display:block}
.credit img.line{height:40px;width:40px;display:block}
.credits{column-gap:18px}
.credits .k{font-size:12px;color:var(--muted);white-space:nowrap;margin-right:-8px}
.credits .sep{width:1px;height:24px;background:var(--rule)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .credit img.fk{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .credit img.fk{filter:brightness(0) invert(1)}
@media (max-width:560px){.credits .sep{display:none}}
.steps-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.steps-row span{font-family:var(--font-display);font-weight:600;font-size:14px;padding:5px 12px;border-radius:8px;background:var(--code-bg)}
.steps-row span.on{background:var(--accent);color:var(--accent-ink)}
.steps-row em{font-style:normal;color:var(--muted)}

details.check{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin:10px 0;background:var(--bg);max-width:72ch}
details.check summary{cursor:pointer;font-weight:600}
details.check summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details.check p{margin:8px 0 2px}

.hero-img{margin:16px 0 0;border-radius:14px;overflow:hidden;border:1px solid var(--rule);line-height:0}
.hero-img img{width:100%;height:auto;display:block}

.soon-card{text-align:left}
.soon-card .big{font-family:var(--font-mono);font-size:13px;color:var(--muted)}

.mark{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);font-size:14.5px}
.mark input{width:18px;height:18px;accent-color:var(--receive)}
footer.pager{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
footer.pager .btn{padding:10px 18px}

@media (max-width:880px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.rail{position:static;padding:8px}
  nav.rail .zone{display:none}
  nav.rail ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.rail li{flex:none}
  nav.rail button{grid-template-columns:46px;padding:4px}
  nav.rail button .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}

/* ===== mobile ===== */
.lightbox{position:fixed;inset:0;z-index:70;background:#070B16;display:flex;flex-direction:column}
.lightbox .lb-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;font-size:13.5px}
.lightbox .lb-bar .btn{background:#fff;color:#0E1A3A;border-color:#fff}
.lightbox .lb-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom;display:flex}
.lightbox .lb-scroll img{display:block;width:230%;max-width:none;height:auto;flex:none;margin:auto 0}
.lightbox.fit .lb-scroll img{width:100%}
.zoom-hint{display:none}
@media (max-width:640px){
  body{font-size:16px;line-height:1.7;padding-inline:12px}
  .wrap{padding-block:10px 24px}
  body.has-pager .wrap{padding-bottom:84px}
  body.has-pager .sitefoot{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .topbar{padding:10px 12px;gap:10px;border-radius:14px}
  .brand{gap:10px}
  .brand img{height:30px;width:auto}
  .brand b{font-size:15.5px}
  .brand span{display:none}
  .controls{width:100%;justify-content:space-between;gap:6px;flex-wrap:nowrap}
  .swatches{gap:5px}
  .sw{width:20px;height:20px}
  .seg button{padding:5px 8px;font-size:12.5px}
  #resetBtn{padding:5px 9px;font-size:12.5px;min-height:34px}
  .metarow{font-size:12.5px;margin-top:8px;gap:4px 12px}
  nav.tracks{margin-top:10px;gap:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  nav.tracks button{min-width:0;padding:7px 12px;scroll-snap-align:start}
  nav.tracks .t-tag{display:none}
  nav.tracks .t-name{font-size:14px}
  .layout{margin-top:12px}
  section.step{padding:20px 16px 24px;border-radius:14px}
  h2{font-size:22px}
  h3{font-size:17px;margin-top:24px}
  .hero h2{font-size:26px}
  .step ol.do{gap:16px}
  .step ol.do>li{grid-template-columns:24px minmax(0,1fr);gap:10px}
  .step ol.do>li::before{width:22px;height:22px;font-size:12px}
  .copyline .val{flex-basis:100%}
  .copyline .btn{flex:1 1 auto;justify-content:center;min-height:42px}
  .btn{min-height:40px}
  figure.shot{margin-inline:-4px}
  .zoom-hint{display:block;font-size:12px;color:var(--muted);padding:5px 12px;background:var(--surface);border-top:1px dashed var(--rule)}
  .flowmap{flex-direction:column;gap:2px}
  .flowmap .node{flex:none}
  .flowmap .arrow{transform:rotate(90deg);line-height:1;padding:2px 0}
  .zones{grid-template-columns:minmax(0,1fr);gap:8px}
  .grid{grid-template-columns:minmax(0,1fr)}
  .tbl{overflow:visible}
  .tbl table{min-width:0}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
  .tbl tr.lab{background:var(--accent-soft);border-color:transparent}
  .tbl tr.lab td{background:none}
  .tbl td{border:0;padding:2px 0;white-space:normal}
  .tbl td:empty{display:none}
  .tbl td:first-child{font-weight:600;color:var(--ink)}
  .tbl td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .kbd-hint{display:none}
  .mark{margin-top:18px}
  #stepFoot footer.pager{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--rule)}
  #stepFoot footer.pager .btn{flex:1;justify-content:center;min-height:46px}
  #stepFoot footer.pager #next{flex:1.6}
  .sitefoot{padding-block:4px 20px}
  .sitefoot-inner{padding:14px 16px}
  .modal-card{padding:18px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
nav.rail button{display:block;white-space:normal}
#tracks button{padding:10px 14px;border:0;border-radius:12px;background:var(--card);color:var(--ink)}
#tracks button[aria-pressed="true"]{background:var(--accent);color:white}
.lesson-controls button{padding:10px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
